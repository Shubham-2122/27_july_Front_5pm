<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- inc pre  ++ value
        post inc  value ++
    -->

    <script>

        let a = 10

        console.log("a :",a)
        a++; // post inc 
        console.log("a :",a)
        ++a ; //pre inc
        console.log("a :",a)

        console.log("a :",++a) //13
        console.log("a :",a++) //14
        console.log("a :",++a) //15
        console.log("a :",a++) //16
        console.log("a :",++a) //17
        console.log("a :",a++) //18
        console.log("a :",++a) //19
        console.log("a :",a++) //20
        console.log("a :",++a) //21
        console.log("a :",a++) //22
        console.log("a :",++a) //23
        console.log("a :",a++) //24
        console.log("a :",++a) //25
        console.log("a :",a++) //26 
        console.log("a :",a)

        console.log("a :",--a)
        console.log("a :",a--)
        console.log("a :",--a)
        console.log("a :",a)
        

    </script>


</body>
</html>
