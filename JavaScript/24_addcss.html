<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            padding: 50px;
            font-size: 50px;
            font-weight: bold;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background: linear-gradient(red, green, blue, yellow);
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <button onclick="adddata()">add css</button>
    <button onclick="removedata()">Remove css</button>
    <button onclick="toggledata()">toggle</button>

    <div id="main">
        Hello this Javascript
    </div>


    <script>
        let main_tag = document.getElementById("main")

        function adddata() {
            main_tag.classList.add("main")
        }

        function removedata() {
            main_tag.classList.remove("main")
        }

        function toggledata() {
            main_tag.classList.toggle("main")
        }
    </script>
</body>

</html>
