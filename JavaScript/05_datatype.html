<body>

    <!-- datatype : primitve and no primitive -->
    
    <script>

        // 1) number 

        let num = 2.5
        console.log(num)
        console.log(typeof(num))

        // 2) string 

        let name1 = "shubham jadav"
        console.log(name1)
        console.log(typeof(name1))

        // 3) bollen : true and false 

        let data =  false

        console.log(data)
        console.log(typeof(data))


        // 4) undefined 
        
        let demo;

        console.log(demo)
        console.log(typeof(demo))


        // 5) null 

        let test = null 
        console.log(test)
        console.log(typeof(test))

        // 6) bigint

        let has = BigInt(3463278453278)
        console.log(has)

        console.log(typeof(has))

        // 7) symbols

    </script>
