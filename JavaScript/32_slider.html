<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 600px;
            width: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    
    <div class="main">
        <img src="/img/1.jpeg" height="100%" class="img" width="100%" alt="">
        <img src="/img/2.jpeg" height="100%" class="img" width="100%" alt="">
        <img src="/img/3.jpeg" height="100%" class="img" width="100%" alt="">
        <img src="/img/4.jpeg" height="100%" class="img" width="100%" alt="">
    </div>
    <button onclick="slider()">Next</button>


    <script>

        let img_tag = document.getElementsByClassName("img")
        console.log(img_tag)

        let index = 0

        function slider(){

            for(let i =0;i<img_tag.length;i++){
                // console.log(img_tag[i])
                img_tag[i].style.display = "none"
            }

            img_tag[index].style.display = "block"
            index ++
            
            if(index == 4){
                index = 0
            }
            // setTimeout(slider,1000)
        }
        // slider()

    </script>

</body>
</html>
