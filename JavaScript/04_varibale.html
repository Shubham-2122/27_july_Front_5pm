<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- varibale : to store a value -->


    <!-- type vari-name = value -->

    <!-- rules : 
    1) do not start number (12asdsad)
    2) do not start with keywor (body,int)
    3) do not start with symbole (*&#) -->

    <script>

        // 1) var : global scope

        var a = 20 ; //declaration allow
        var a = 24  // re-delcartion allow
        a = 30 // re-assigment allow

        console.log("a : ",a)


        // 2) let : local & block scope
        let b = 40 //declaration allow 
        // let b = 45  // re-delcartion not allow
        b = 50 // re-assigment allow

        console.log("B : ",b)

        // 3) const : block : unique

        const x = 80  //declaration allow  
        // const x = 90// re-delcartion not allow 
        // x = 95 // re-assigment not allow

        console.log("x : ",x)


    </script>


</body>
</html>
