<!DOCTYPE html>

    <meta charset="UTF-8">

<body>
    <!-- form : user entery -->

    <!-- pattern : []{} -->

    <!-- html old -->

    <form action="" align="center">
        <div>
            <label for="">Enter your Name</label>
            <!-- <input type="text" placeholder="Enter your name" pattern="[A-Za-z]+" value="" title="Name" required> -->
             <input type="text" placeholder="Enter your name" pattern="[A-Za-z]{2,9}" value="" title="Name" required>
        </div>
        <div>
            <label for="">Enter your Surname</label>
            <input type="text" placeholder="Enter your Surname" pattern="[A-Za-z]{2,9}"  required>
        </div>
                <div>
            <label for="">Enter your Phone</label>
            <input type="tel" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="Enter your phone" required>
        </div>
        <div>
            <!-- shubhamjada45@gmail.com 
                [a-z0-9]+'@'+[a-z]+'.'+[a-z]{2,3}$
            -->
            <label for="">Enter your email</label>
            <input type="email" placeholder="Enter your Email" required>
        </div>

        <div>
            <label for="">Enter your Password</label>
            <input type="password" part="[A-Z][A-Za-z0-9#%]{6,10}" placeholder="enter your Password" required>
        </div>
        <div>
            <input type="submit">
        </div>
    </form>

</body>
