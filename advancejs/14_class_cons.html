<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        class Arith{
            constructor(a,b){
                this.a = a 
                this.b = b 
            }
            sum(){
                console.log(`Sum : ${this.a + this.b}`)
            }
            mul(){
                console.log(`Mul : ${this.a * this.b}`)
            }
            divi(){
                console.log(`div : ${this.a / this.b}`)
            }
            sub(){
                console.log(`Sub : ${this.a - this.b}`)
            }
        }

        const test = new Arith(50,23)
        test.mul()
        test.sub()
        test.divi()
        test.sum()

    </script>

</body>
</html>
