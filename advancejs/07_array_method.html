<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        
        let arr = [1,2,3,4,5]

        console.log(arr.length)

        let arr1 = [6,7,8,9,10]

        console.log(arr.concat(arr1))
        console.log(arr)

        // last element data add
        arr.push(6)
        console.log(arr)

        // last elemnet remove 
        arr.pop()
        console.log(arr)

        // unshift first element add
        arr.unshift(1)
        console.log(arr)

        arr.shift()
        console.log(arr)

        console.log(arr.reverse())

        const data = ['shubham','sujal','meet','jigar','ketan','jay']

        const val = data.filter((word)=> word.length < 5)
        console.log(val)

        const elements = ["Fire", "Air", "Water"];

        console.log(elements.join())
        console.log(elements.join(""))
        console.log(elements.join("-"))


        const animals = ["ant", "bison", "camel", "duck", "elephant"];

        console.log(animals)

        console.log(animals.slice(2))
        console.log(animals.slice(0,3))

    </script>

</body>
</html>
