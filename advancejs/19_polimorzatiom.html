        // overriding 

        class A{
            test(){

        class B extends A {
             test(){
                console.log("B class")
            }
        }
        class C extends B {
             test(){
                console.log("C class")
            }
        }

        // const ob =  new C

        // ob.test()

        const ab = [new A,new B,new C]
        console.log(ab)
        
        ab.forEach((demo)=>{
            demo.test()
        })
