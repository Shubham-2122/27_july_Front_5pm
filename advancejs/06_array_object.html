<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        // 1 ) array inside array 
        let arr = [1, 2, 3, [4, 5, 6, [7, 8, 9]]]
        console.log(arr)
        console.log(arr[2])
        console.log(arr[3][1])
        console.log(arr[3][3][2])

        // 2) array inside object 

        let data = [1, 2, 3, {
            front: "front-end",
            back: "back-end"
        }, 56]

        console.log(data)
        console.log(data[3].back)

        // 3) object inside object 

        let person = {
            name :"hello",
            course : {
                front :"front-end",
                back : "back",
                full : "full-stack"
            }
        }

        console.log(person)
        console.log(person.course.full)

        // 4) object inside array 

        let person1 = {
             name :"hello",
            course : ["front","back","mern"],
            age : 23
        }

    </script>

</body>

</html>
