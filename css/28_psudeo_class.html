<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            background-color: lightcoral;
        }
        ul li:last-child{
            background-color: aqua;
        }
        ul li:nth-child(3){
            background-color: green;
        }
        ul li:nth-child(even){
            background-color: gray;
        }
        ul li:nth-child(odd){
            background-color: lawngreen;
        }
        ul li:nth-last-child(1){
            background-color: aqua;
        }
        .main{
            height: 200px;
            width: 200px;
            border: 2px solid;
            transition: .7s;
        }
        .main:hover {
            background-color: lightcoral;
            transform: translate(100px);
            border-radius: 60px;
            
        }
        input{
            margin-top: 50px;
        }
        input:focus{
            background-color: lightcoral;
            color: white;
        }
    </style>
</head>
<body>
    <!-- psude class :  -->

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Home</li>
        <li>Contact</li>
        <li>Home</li>
        <li>Help</li>
        <li>Home</li>
    </ul>

    <!-- prent to prent -->
     <!-- prent to child -->

    <div class="main">

    </div>


    <input type="text" placeholder="Enter you name">

</body>
</html>
