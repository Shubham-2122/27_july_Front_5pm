<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .data{
            height: 300px;
            width: 490px;
            border: 2px solid;
            overflow: hidden;
        }
        .main{
            height: 300px;
            width: 500px;
            border: 2px solid;
            background: url("https://demo.w3layouts.com/demos_new/template_demo/20-06-2017/elite_shoppy-demo_Free/1660570665/web/images/bottom1.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            transform: translateX(-14px);
            transition: .3s;
        }
        .border{
            height: 200px;
            width: 400px;
            border: 5px solid white;
            margin: 50px auto;
            font-size: 30px;
            color: white;
            font-weight: 700;
            text-align: right;
            letter-spacing: 10px;
            line-height: 200px;
            transform: translateX(-14px);
            transition: .3s;
            opacity: 0;
        }
        .main:hover{
                transform: translateX(0px);
        }
        .main:hover .border{
             transform: translateX(0px);
             opacity: 1;
        }
    </style>
</head>
<body>
   <div class="data">
     <div class="main">
        <div class="border">
            New Arrivals
        </div>
    </div>
   </div>
</body>
</html>
